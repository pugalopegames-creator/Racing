<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mouse Racer sign-in</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1d2b1c; color: #f3f1e8; font: 16px system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
</style>
</head>
<body>
<p id="msg">Signing you in…</p>
<script>
  // Supabase sends the sign-in window here with a one-time code (or an error).
  // Pass it to the game window that opened us, then close.
  const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.slice(1));
  const code = q.get('code');
  const error = q.get('error_description') || h.get('error_description') || q.get('error') || h.get('error');
  const msg = { type: 'mr-auth', code, error: error ? String(error).replace(/\+/g, ' ') : (code ? null : 'No sign-in code came back') };
  if (window.opener) {
    window.opener.postMessage(msg, '*');
    setTimeout(() => window.close(), 300);
    document.getElementById('msg').textContent = msg.error ? 'Sign-in failed: ' + msg.error : 'Signed in. You can close this window.';
  } else {
    document.getElementById('msg').textContent = 'Please go back to the game and try again from there.';
  }
</script>
</body>
</html>
