<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mouse Racer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  /* Single dark look on purpose: a night-time paddock, lit by the HUD. */
  :root {
    --ground: #1d2b1c;
    --ink: #f3f1e8;
    --muted: #a9b2a0;
    --signal: #ffc83d;
    --panel: rgba(12, 16, 12, 0.62);
    --font-display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--ink); }
  body { font-family: var(--font-body); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* Settings panel sits under the lap panel (16px gutter, lap panel is 200 × 112). */
  .settings {
    position: fixed; left: 16px; top: 140px; width: 220px; box-sizing: border-box;
    max-height: calc(100% - 200px); overflow-y: auto;
    padding: 10px 14px 12px; border-radius: 6px; background: var(--panel);
    display: grid; gap: 10px; cursor: default; user-select: none;
  }
  .set-head { display: flex; justify-content: space-between; align-items: center; }
  .set-title { font: 600 11px var(--font-body); letter-spacing: 0.08em; color: var(--muted); }
  .set-toggle {
    font: 600 11px var(--font-body); letter-spacing: 0.04em; color: var(--ink);
    background: transparent; border: 1px solid rgba(243, 241, 232, 0.25); border-radius: 4px;
    padding: 3px 8px; cursor: pointer;
  }
  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .presets button {
    font: 700 14px var(--font-display); letter-spacing: 0.04em; color: var(--ink);
    background: rgba(243, 241, 232, 0.08); border: 1px solid transparent; border-radius: 4px;
    padding: 4px 0; cursor: pointer;
  }
  .presets button[aria-pressed="true"] { border-color: var(--signal); color: var(--signal); }
  .cars { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .cars button {
    display: grid; justify-items: center; gap: 4px; padding: 6px 0 5px; cursor: pointer;
    background: rgba(243, 241, 232, 0.08); border: 1px solid transparent; border-radius: 4px;
    font: 700 12px var(--font-display); letter-spacing: 0.04em; color: var(--ink);
  }
  .cars img { height: 44px; width: auto; transform: rotate(90deg); margin: -6px 0; pointer-events: none; }
  .cars button[aria-pressed="true"] { border-color: var(--signal); color: var(--signal); }
  .set-body { display: grid; gap: 10px; }
  .set-body[hidden] { display: none; }
  .row { display: grid; gap: 4px; }
  .row-head { display: flex; justify-content: space-between; align-items: baseline; }
  .row label { font: 600 11px var(--font-body); letter-spacing: 0.08em; color: var(--muted); }
  .row output { font: 700 18px var(--font-display); color: var(--ink); font-variant-numeric: tabular-nums; }
  .row input { width: 100%; margin: 0; accent-color: var(--signal); cursor: pointer; }
  .join { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  .join input {
    min-width: 0; box-sizing: border-box; padding: 5px 7px; cursor: text;
    font: 400 12px var(--font-body); color: var(--ink);
    background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(243, 241, 232, 0.25); border-radius: 4px;
  }
  .join input::placeholder { color: var(--muted); }
  .join button {
    font: 700 13px var(--font-display); letter-spacing: 0.04em; color: var(--signal);
    background: transparent; border: 1px solid var(--signal); border-radius: 4px; padding: 0 10px; cursor: pointer;
  }
  .join input:focus-visible, .join button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  .row small { font: 400 11px var(--font-body); color: var(--muted); }
  .row.off { opacity: 0.45; }
  .settings button:focus-visible, .row input:focus-visible, .cars button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Race track. The car steers itself; hold W for gas and S to brake."></canvas>
<section class="settings" aria-label="Settings">
  <div class="set-head">
    <span class="set-title">SETTINGS</span>
    <button class="set-toggle" id="set-toggle" type="button" aria-expanded="false" aria-controls="set-body">Show</button>
  </div>
  <div class="set-body" id="set-body" hidden>
    <div class="row">
      <div class="row-head"><label for="join-addr">PLAY ONLINE</label></div>
      <div class="join">
        <input id="join-addr" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Server, e.g. 192.168.1.23:3000">
        <button id="join-btn" type="button">JOIN</button>
      </div>
      <small id="join-note">Practice with bots. Enter an address to race people.</small>
    </div>
    <div class="cars" role="group" aria-label="Your car">
      <button type="button" data-car="gt" aria-pressed="true"><img src="./cars/gt.png" alt=""><span>ROAD CAR</span></button>
      <button type="button" data-car="proto" aria-pressed="false"><img src="./cars/proto.png" alt=""><span>PROTOTYPE</span></button>
    </div>
    <div class="presets" role="group" aria-label="Difficulty presets">
      <button type="button" data-preset="easy" aria-pressed="false">EASY</button>
      <button type="button" data-preset="normal" aria-pressed="true">NORMAL</button>
      <button type="button" data-preset="hard" aria-pressed="false">HARD</button>
    </div>
    <div class="row">
      <div class="row-head"><label for="pace">PACE</label><output id="pace-out" for="pace">100%</output></div>
      <input id="pace" type="range" min="10" max="100" step="5" value="100">
      <small id="pace-note">Top speed 45 km/h</small>
    </div>
    <div class="row">
      <div class="row-head"><label for="grip">TYRE GRIP</label><output id="grip-out" for="grip">100%</output></div>
      <input id="grip" type="range" min="70" max="130" step="5" value="100">
      <small id="grip-note">Lower: slides sooner, brake earlier</small>
    </div>
    <div class="row">
      <div class="row-head"><label for="accel">ACCELERATION</label><output id="accel-out" for="accel">100%</output></div>
      <input id="accel" type="range" min="50" max="200" step="10" value="100">
      <small id="accel-note">0 to top speed in 9.3 s</small>
    </div>
    <div class="row" id="row-field">
      <div class="row-head"><label for="field">CARS</label><output id="field-out" for="field">4</output></div>
      <input id="field" type="range" min="2" max="20" step="1" value="4">
      <small id="field-note">You and 3 bots · you start last</small>
    </div>
    <div class="row" id="row-botspeed">
      <div class="row-head"><label for="botspeed">BOT SPEED</label><output id="botspeed-out" for="botspeed">100%</output></div>
      <input id="botspeed" type="range" min="85" max="110" step="1" value="100">
      <small id="botspeed-note">How hard the bots push</small>
    </div>
    <div class="row" id="row-mistakes">
      <div class="row-head"><label for="mistakes">BOT MISTAKES</label><output id="mistakes-out" for="mistakes">100%</output></div>
      <input id="mistakes" type="range" min="0" max="200" step="10" value="100">
      <small id="mistakes-note">About 1 corner in 3</small>
    </div>
  </div>
</section>
<script type="module" src="./game.js"></script>
</body>
</html>
